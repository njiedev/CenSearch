[project]
name = "censearch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "opencv-python-headless==4.11.0.86",
  "numpy==2.2.6",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "sqlalchemy==2.0.40",
  "httpx==0.28.1",
  "beautifulsoup4==4.13.4",
  "playwright==1.51.0",
  "python-multipart==0.0.20",
  "pillow==12.1.1",
  "pydantic-settings==2.15.0",
  "strands-agents[openai]==1.59.0",
  "strands-agents-tools==0.8.9",
  "boto3==1.43.111",
  "bcrypt==5.0.0",
]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["censearch", "mockweb"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
